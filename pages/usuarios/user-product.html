<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pele Douro - Loja de Produtos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="shortcut icon" href="../../assets/img/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="../../css/usuarios/user-product.css">
</head>
<body>
    <div class="container">
        <div class="overlay"></div>
        
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <img src="../../assets/img/logo.png" alt="Logo Pele Douro">
            </div>
            <button class="close-sidebar">
                <i class="fa-solid fa-x"></i>
            </button>
            <a href="user-home.html" class="nav-item">
                <i class="far fa-calendar-alt"></i>
                <span>Agendamentos</span>
            </a>
            <a href="user-product.html" class="nav-item active">
                <i class="fas fa-store"></i>
                <span>Loja de Produtos</span>
            </a>
            <a href="user-chat.html" class="nav-item">
                <i class="far fa-comments"></i>
                <span>Chat</span>
            </a>
            <a href="user-service.html" class="nav-item">
                <i class="fas fa-concierge-bell"></i>
                <span>Serviços</span>
            </a>
            <a href="user-plans.html" class="nav-item">
                <i class="fas fa-crown"></i>
                <span>Planos</span>
            </a>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="header">
                <button class="menu-toggle">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="page-title">
                    <h1>Loja de Produtos</h1>
                    <p>Encontre os melhores produtos para sua pele</p>
                </div>
                <div class="header-icons">
                    <div class="notification-icon">
                        <i class="fas fa-bell"></i>
                        <span class="notification-badge" id="TotalDeNotificacoes">0</span>
                        <div id="notification-container"></div>
                    </div>
                    <div class="cart-icon">
                        <a href="user-cart.html"><i class="fas fa-shopping-cart"></i></a>
               
                    </div>
                    <div class="user-profile">
                        <i class="fa-solid fa-user"></i>
                        <span id="user-name">Usuário <i class="fas fa-chevron-down"></i></span>
                        <div class="dropdown-content">
                            <a href="user-history.html"><i class="fa-solid fa-clock-rotate-left"></i> Histórico</a>
                            <a href="user-settings.html"><i class="fas fa-cog"></i> Definições</a>
                            <a href="#" id="logout"><i class="fas fa-sign-out-alt"></i> Terminar sessão</a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Barra de pesquisa e filtro -->
            <div class="search-filter-container">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Pesquisar produtos..." id="search-input">
                </div>
                <div class="filter-dropdown">
                    <select id="category-filter">
                        <option value="all">Todas as categorias</option>
                        <option value="hidratantes">Hidratantes</option>
                        <option value="limpeza">Limpeza Facial</option>
                        <option value="anti-idade">Anti-idade</option>
                        <option value="protetores">Protetores Solares</option>
                    </select>
                </div>
                <div class="filter-dropdown">
                    <select id="sort-filter">
                        <option value="default">Ordenar por</option>
                        <option value="price-asc">Preço: menor para maior</option>
                        <option value="price-desc">Preço: maior para menor</option>
                        <option value="rating-desc">Melhor avaliados</option>
                        <option value="newest">Novidades</option>
                    </select>
                </div>
            </div>
            
            <hr>
            
            <!-- Lista de Produtos -->
            <section class="section-products">
                <!-- Dynamic product cards will be populated by JavaScript -->
            </section>
        </main>

        <!-- Modal de Detalhes do Produto -->
        <div id="product-detail-modal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeModal('product-detail-modal')">×</span>
                <div class="product-detail-container">
                    <div class="product-detail-image">
                        <img src="" alt="" id="product-image">
                    </div>
                    <div class="product-detail-info">
                        <h3 id="product-name"></h3>
                        <div class="rating" id="product-rating"></div>
                        <div class="product-detail-price" id="product-price"></div>
                        <p class="product-detail-description" id="product-description"></p>
                        <div class="product-detail-meta">
                            <div><strong>Marca:</strong> <span id="product-brand"></span></div>
                            <div><strong>Volume:</strong> <span id="product-volume"></span></div>
                            <div><strong>Tipo de pele:</strong> <span id="product-skin-type"></span></div>
                            <div><strong>Ingredientes principais:</strong> <span id="product-ingredients"></span></div>
                        </div>
                        <div class="quantity-selector">
                            <button onclick="decreaseQuantity()">-</button>
                            <input type="number" value="1" min="1" id="product-quantity">
                            <button onclick="increaseQuantity()">+</button>
                        </div>
                        <button class="add-to-cart-large" onclick="addToCartFromModal()">
                            <i class="fas fa-shopping-cart"></i> Adicionar ao Carrinho
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal de Confirmação de Adição ao Carrinho -->
        <div id="add-to-cart-modal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeModal('add-to-cart-modal')">×</span>
                <h3>Produto adicionado ao carrinho!</h3>
                <div class="modal-buttons">
                    <button class="cancel" onclick="closeModal('add-to-cart-modal')">Continuar comprando</button>
                    <button class="confirm" onclick="goToCart()">Ir para o carrinho</button>
                </div>
            </div>
        </div>

        <!-- Notificações Dropdown -->
        <div class="notifications-dropdown" id="notificationsDropdown">
            <div class="notification-item"></div>
        </div>

        <!-- Carrinho Dropdown -->
        
      
    </div>
    <script src="../../js/global.js"></script>
    <script src="../../js/usuarios/user-product.js"></script>
    <script src="../../apis/generalSection.js"></script>
    <script src="../../apis/users.js"></script>
    <script src="../../apis/cartsProducts.js"></script>
    <script src="../../apis/products.js"></script>
    <script src="../../js/messageModal.js"></script>
    <script src="../../apis/notificacoes.js"></script>
    <script src="../../js/notificacoes.js"></script>
    <script src="../../js/sessoes/logout.js"></script>
</body>
</html>
