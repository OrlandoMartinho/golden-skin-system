<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pele Douro - Planos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/usuarios/user-plans.css">
</head>
<body>
    <div class="container">
        <div class="overlay"></div>
        
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <img src="../../assets/img/logo.png" alt="">
            </div>
            <button class="close-sidebar">
                <i class="fa-solid fa-x"></i>
            </button>
            <a href="user-home.html" class="nav-item">
                <i class="far fa-calendar-alt"></i>
                <span>Agendamentos</span>
            </a>
            <a href="user-product.html" class="nav-item">
                <i class="fas fa-store"></i>
                <span>Loja de Produtos</span>
            </a>
            <a href="user-chat.html" class="nav-item">
                <i class="far fa-comments"></i>
                <span>Chat</span>
            </a>
            <a href="user-service.html" class="nav-item">
                <i class="fas fa-concierge-bell"></i>
                <span>Serviços</span>
            </a>
            <a href="user-plans.html" class="nav-item active">
                <i class="fas fa-crown"></i>
                <span>Planos</span>
            </a>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="header">
                <button class="menu-toggle">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="page-title">
                    <h1>Planos</h1>
                    <p>Escolha o plano ideal para você</p>
                </div>
                <div class="header-icons">
                       <div class="notification-icon">
                        <i class="fas fa-bell"></i>
                        <span class="notification-badge" id="TotalDeNotificacoes">0</span>
                        <div id="notification-container"></div>
                    </div>
                    <div class="cart-icon">
                        <a href="user-cart.html"><i class="fas fa-shopping-cart"></i></a>
                     
                    </div>
                    <div class="user-profile">
                        <i class="fa-solid fa-user"></i>
                        <span>Admin <i class="fas fa-chevron-down"></i></span>
                        <div class="dropdown-content">
                            <a href="user-history.html"><i class="fa-solid fa-clock-rotate-left"></i> Histórico</a>
                            <a href="user-settings.html"><i class="fas fa-cog"></i> Definições</a>
                            <a href="#" id="logout"><i class="fas fa-sign-out-alt"></i> Terminar sessão</a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Plans Container -->
            <div class="plans-container">
                <!-- Navigation Tabs -->
                <div class="plans-tabs">
                    <div class="plans-tab active" data-tab="available-plans">
                        <i class="fas fa-list"></i> Planos Disponíveis
                    </div>
                    <div class="plans-tab" data-tab="my-subscriptions">
                        <i class="fas fa-user-check"></i> Minhas Subscrições
                    </div>
                </div>

                <!-- Available Plans Tab -->
                <div id="available-plans-tab" class="plans-content active">
                    <div class="plans-header">
                        <h2>Planos Disponíveis</h2>
                    </div>
                    <div class="plans-list"></div>
                </div>

                <!-- My Subscriptions Tab -->
                <div id="my-subscriptions-tab" class="plans-content">
                    <div class="plans-header">
                        <h2>Minhas Subscrições</h2>
                    </div>
                    <div class="subscriptions-list"></div>
                </div>
            </div>
        </main>

       <div class="notifications-dropdown" id="notificationsDropdown">
            <div class="notification-item"></div>
        </div>

       
    </div>

    <script src="../../js/global.js"></script>
    <script src="../../js/usuarios/user-plans.js"></script>
    <script src="../../apis/generalSection.js"></script>
    <script src="../../apis/users.js"></script>
    <script src="../../apis/subscribers.js"></script>
    <script src="../../apis/plans.js"></script>
    <script src="../../js/messageModal.js"></script>
    <script src="../../apis/notificacoes.js"></script>
    <script src="../../js/notificacoes.js"></script>
    <script src="../../js/sessoes/logout.js"></script>
   
</body>
</html>
