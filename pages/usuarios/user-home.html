<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pele Douro - Agendamentos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="shortcut icon" href="../../assets/img/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="../../css/usuarios/user-home.css">
</head>
<body>
    <div class="container">
        <div class="overlay"></div>
        
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <img src="../../assets/img/logo.png" alt="Logo Pele Douro">
            </div>
            <button class="close-sidebar">
                <i class="fa-solid fa-x"></i>
            </button>
            <a href="#" class="nav-item active">
                <i class="far fa-calendar-alt"></i>
                <span>Agendamentos</span>
            </a>
            <a href="user-product.html" class="nav-item">
                <i class="fas fa-store"></i>
                <span>Loja de Produtos</span>
            </a>
            <a href="user-chat.html" class="nav-item">
                <i class="far fa-comments"></i>
                <span>Chat</span>
            </a>
            <a href="user-service.html" class="nav-item">
                <i class="fas fa-concierge-bell"></i>
                <span>Serviços</span>
            </a>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="header">
                <button class="menu-toggle">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="page-title">
                    <h1>Agendamentos</h1>
                    <p>Agenda os serviços que combinam com você</p>
                </div>
                <div class="header-icons">
                    <div class="notification-icon">
                        <i class="fas fa-bell"></i>
                        <span class="notification-badge" id="TotalDeNotificacoes">0</span>
                        <div id="notification-container"></div>
                    </div>
                    <div class="cart-icon">
                        <a href="user-cart.html"><i class="fas fa-shopping-cart"></i></a>
                        <span class="cart-count">0</span> 
                    </div>
                    <div class="user-profile">
                        <i class="fa-solid fa-user"></i>
                        <span id="user-name">Usuário <i class="fas fa-chevron-down"></i></span>
                        <div class="dropdown-content">
                            <a href="user-history.html"><i class="fa-solid fa-clock-rotate-left"></i> Histórico</a>
                            <a href="user-settings.html"><i class="fas fa-cog"></i> Definições</a>
                            <a href="#" id="logout"><i class="fas fa-sign-out-alt"></i> Terminar sessão</a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Barra de pesquisa e filtro -->
            <div class="search-filter-container">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Pesquisar agendamentos..." id="search-input">
                </div>
                <div class="filter-dropdown">
                    <select id="status-filter">
                        <option value="all">Todos os status</option>
                        <option value="active">Ativo</option>
                        <option value="inactive">Inativo</option>
                    </select>
                </div>
                <div class="date-filter">
                    <input type="date" id="date-filter">
                </div>
            </div>
            
            <hr>
            
            <section class="section-agendaments">
                <!-- Dynamic appointment cards will be populated by JavaScript -->
            </section>
        </main>

        <!-- Modal de Exclusão -->
        <div id="excluir-modal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeModal('excluir-modal')">×</span>
                <h3>Confirmar Exclusão</h3>
                <p>Tem certeza que deseja excluir este agendamento?</p>
                <div class="modal-buttons">
                    <button class="cancel" onclick="closeModal('excluir-modal')">Cancelar</button>
                    <button class="confirm" id="confirm-delete">Confirmar</button>
                </div>
            </div>
        </div>

        <!-- Modal de Reagendamento -->
        <div id="reagendar-modal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeModal('reagendar-modal')">×</span>
                <h3>Reagendar Serviço</h3>
                <form id="reagendar-form">
                    <div class="form-group">
                        <label>Nova Data</label>
                        <input type="date" id="new-date" required>
                    </div>
                    <div class="form-group">
                        <label>Novo Horário</label>
                        <input type="time" id="new-time" required>
                    </div>
                    <div class="modal-buttons">
                        <button type="button" class="cancel" onclick="closeModal('reagendar-modal')">Cancelar</button>
                        <button type="submit" class="confirm">Confirmar</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Notificações Dropdown -->
        <div class="notifications-dropdown" id="notificationsDropdown">
            <div class="notification-item"></div>
        </div>

        <!-- Carrinho Dropdown -->
        <div class="cart-dropdown">
            <div class="cart-item">
                <img src="https://via.placeholder.com/50" alt="Produto">
                <div>
                    <p>Creme Hidratante</p>
                    <small>1x R$ 59,90</small>
                </div>
                <i class="fas fa-times"></i>
            </div>
            <div class="cart-total">
                <p>Total: R$ 0,00</p>
                <button>Finalizar Compra</button>
            </div>
        </div>
    </div>
    <script src="../../js/global.js"></script>
    <script src="../../js/usuarios/user-home.js"></script>
    <script src="../../apis/generalSection.js"></script>
    <script src="../../apis/users.js"></script>
    <script src="../../apis/services.js"></script>
    <script src="../../apis/appointments.js"></script>
    <script src="../../js/messageModal.js"></script>
    <script src="../../apis/notificacoes.js"></script>
    <script src="../../js/notificacoes.js"></script>
    <script src="../../js/sessoes/logout.js"></script>
</body>
</html>
